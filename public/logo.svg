<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <defs>
    <!-- Gradient for mountain -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="50%" style="stop-color:#B8B8B8"/>
      <stop offset="100%" style="stop-color:#888888"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- SU text -->
  <g filter="url(#glow)">
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="300" fill="#FFFFFF" letter-spacing="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
      SU
    </text>
  </g>
  
  <!-- Mountain Triangle -->
  <g>
    <!-- Back mountain -->
    <polygon points="62,55 80,24 98,55" fill="url(#mountainGrad)" opacity="0.7">
      <animate attributeName="opacity" values="0;0.7" dur="0.8s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.8s" begin="0.3s" fill="freeze"/>
    </polygon>
    
    <!-- Front mountain -->
    <polygon points="70,55 92,17 114,55" fill="url(#mountainGrad)">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,15;0,0" dur="0.8s" begin="0.4s" fill="freeze"/>
    </polygon>
  </g>
  
  <!-- MIT text -->
  <g filter="url(#glow)">
    <text x="112" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="300" fill="#FFFFFF" letter-spacing="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
      MIT
    </text>
  </g>
  
  <!-- Decorative lines -->
  <line x1="20" y1="58" x2="55" y2="58" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6">
    <animate attributeName="x2" values="20;55" dur="0.5s" begin="0.8s" fill="freeze"/>
  </line>
  <line x1="175" y1="58" x2="280" y2="58" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6">
    <animate attributeName="x2" values="175;280" dur="0.5s" begin="0.8s" fill="freeze"/>
  </line>
  
  <!-- INSIGHTS AND ASSOCIATES text -->
  <text x="150" y="72" font-family="Arial, sans-serif" font-size="10" font-weight="300" fill="#FFFFFF" letter-spacing="3" text-anchor="middle" opacity="0.9">
    <animate attributeName="opacity" values="0;0.9" dur="0.6s" begin="1s" fill="freeze"/>
    INSIGHTS AND ASSOCIATES
  </text>
</svg>