<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70" fill="none">
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- SU text with fade in -->
  <text x="10" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#FFFFFF" letter-spacing="2" opacity="0">
    SU
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
  </text>
  
  <!-- Mountain/Triangle with scale animation -->
  <g transform="translate(62, 8)">
    <g opacity="0">
      <path d="M0 42 L22 5 L44 42 Z" fill="url(#mountainGrad)" stroke="#CCCCCC" stroke-width="0.5"/>
      <path d="M30 42 L52 5 L74 42 Z" fill="url(#mountainGrad)" stroke="#CCCCCC" stroke-width="0.5"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="37 20" to="0 0" dur="0.5s" begin="0.5s" fill="freeze"/>
    </g>
  </g>
  
  <!-- MIT text with fade in -->
  <text x="150" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#FFFFFF" letter-spacing="2" opacity="0">
    MIT
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
  </text>
  
  <!-- Decorative lines with draw animation -->
  <line x1="10" y1="52" x2="10" y2="52" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7">
    <animate attributeName="x2" from="10" to="60" dur="0.4s" begin="1.2s" fill="freeze"/>
  </line>
  <line x1="200" y1="52" x2="200" y2="52" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7">
    <animate attributeName="x1" from="200" to="150" dur="0.4s" begin="1.2s" fill="freeze"/>
  </line>
  
  <!-- INSIGHTS AND ASSOCIATES with fade in -->
  <text x="10" y="64" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" letter-spacing="3" opacity="0">
    INSIGHTS AND ASSOCIATES
    <animate attributeName="opacity" from="0" to="0.9" dur="0.6s" begin="1.4s" fill="freeze"/>
  </text>
</svg>